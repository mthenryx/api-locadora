openapi: 3.0.3
info:
  title: Projeto de Controle de Filmes - SENAI Jandira
  description: |-
    API destinada para controle de filmes
  termsOfService: http://swagger.io/terms/
  contact:
    email: 09matheushenry@gmail.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
  - url: http://localhost:3000
paths:

  # ─────────────────────────── FILME ───────────────────────────
  /v1/senai/locadora/filme:
    post:
      tags:
        - Filme
      summary: Adiciona um novo Filme
      description: Adiciona um novo Filme
      requestBody:
        description: JSON contendo os dados do novo filme a ser inserido no sistema
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Filme'
            example:
              nome: "Matheus contra os Malignos"
              data_lancamento: "2000-01-01"
              duracao: "01:40:00"
              sinopse: "teste 1"
              avaliacao: 5
              valor: 10
              capa: "malignos2"
              id_classificacao: 2
              genero:
                - id: 1
                - id: 2
              ator:
                - id: 1
                - id: 2
              diretor:
                - id: 1
                - id: 2
        required: true
      responses:
        '201':
          description: Success Created Item
        '400':
          description: Error Bad Request
        '415':
          description: Error Content Type
        '500':
          description: Error Internal Server (Controller | Model)
    get:
      tags:
        - Filme
      summary: Lista todos os Filmes
      description: Listagem de todos os filmes registrados no sistema
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FilmeGet'
        '404':
          description: Error Not Found
        '500':
          description: Error Internal Server (Controller | Model)

  /v1/senai/locadora/filme/{id}:
    get:
      tags:
        - Filme
      summary: Busca um Filme pelo ID
      description: Retorna um Filme pelo ID
      parameters:
        - name: id
          in: path
          description: ID para realizar a busca do Filme
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilmeGet'
        '400':
          description: Error Bad Request (id)
        '404':
          description: Error Not found
        '500':
          description: Error Internal Server (Controller | Model)
    put:
      tags:
        - Filme
      summary: Atualiza um filme pelo ID
      description: Atualiza um filme pelo ID colocando as informações da mesma forma que o POST
      parameters:
        - name: id
          in: path
          description: ID para atualizar o filme
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Dados para atualizar um filme existente
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Filme'
            example:
              nome: "Matheus contra os Malignos"
              data_lancamento: "2000-01-01"
              duracao: "01:40:00"
              sinopse: "teste 1"
              avaliacao: 5
              valor: 10
              capa: "malignos2"
              id_classificacao: 2
              genero:
                - id: 1
                - id: 2
              ator:
                - id: 1
                - id: 2
              diretor:
                - id: 1
                - id: 2
        required: true
      responses:
        '200':
          description: ok
        '400':
          description: Error Bad Request (id | dados)
        '404':
          description: Error Not Found
        '415':
          description: Error Content Type
        '500':
          description: Error internal server (Controller | Model)
    delete:
      tags:
        - Filme
      summary: Exclui um Filme pelo ID
      description: Excluir um Filme existente buscando pelo ID
      parameters:
        - name: id
          in: path
          description: ID para realizar a busca do filme
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Success Delete
        '400':
          description: Error Bad Request (ID)
        '500':
          description: Error Internal Server (Controller | Model)

