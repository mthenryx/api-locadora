# ═══════════════════════════════════════════════════════════════
#  SCHEMAS
# ═══════════════════════════════════════════════════════════════
components:
  schemas:

    # ── Referência de ID (usada em arrays de relacionamento) ──
    IdRef:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
          example: 1

    # ── FILME ──
    Filme:
      required:
        - nome
        - sinopse
        - capa
        - data_lancamento
        - duracao
        - id_classificacao
      type: object
      properties:
        nome:
          type: string
          maxLength: 80
          example: "Matheus contra os Malignos"
          description: Máximo de 80 caracteres
        sinopse:
          type: string
          example: "teste 1"
          description: Sem limite de caracteres
        capa:
          type: string
          maxLength: 255
          example: "malignos2"
          description: Máximo de 255 caracteres
        data_lancamento:
          type: string
          format: date
          example: "2000-01-01"
        duracao:
          type: string
          example: "01:40:00"
          pattern: '^(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
          description: Formato HH:MM:SS
        valor:
          type: number
          format: double
          example: 10.00
          description: Máximo 999.99 (duas casas decimais)
        avaliacao:
          type: number
          format: double
          example: 5.0
          description: De 0.0 a 5.0 (uma casa decimal)
        id_classificacao:
          type: integer
          format: int64
          example: 2
          description: ID da classificação indicativa
        genero:
          type: array
          description: Lista de IDs de gêneros associados ao filme
          items:
            $ref: '#/components/schemas/IdRef'
          example:
            - id: 1
            - id: 2
        ator:
          type: array
          description: Lista de IDs de atores associados ao filme
          items:
            $ref: '#/components/schemas/IdRef'
          example:
            - id: 1
            - id: 2
        diretor:
          type: array
          description: Lista de IDs de diretores associados ao filme
          items:
            $ref: '#/components/schemas/IdRef'
          example:
            - id: 1
            - id: 2

    FilmeGet:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nome:
          type: string
          maxLength: 80
          example: "Matheus contra os Malignos"
        sinopse:
          type: string
          example: "teste 1"
        capa:
          type: string
          maxLength: 255
          example: "malignos2"
        data_lancamento:
          type: string
          format: date
          example: "2000-01-01"
        duracao:
          type: string
          example: "01:40:00"
        valor:
          type: number
          format: double
          example: 10.00
        avaliacao:
          type: number
          format: double
          example: 5.0
        id_classificacao:
          type: integer
          format: int64
          example: 2
        genero:
          type: array
          items:
            $ref: '#/components/schemas/IdRef'
        ator:
          type: array
          items:
            $ref: '#/components/schemas/IdRef'
        diretor:
          type: array
          items:
            $ref: '#/components/schemas/IdRef'

    # ── DIRETOR ──
    Diretor:
      required:
        - nome
        - data_nascimento
        - id_sexo_diretor
        - id_nacionalidade_diretor
      type: object
      properties:
        nome:
          type: string
          maxLength: 100
          example: "Camila Rocha"
          description: Máximo de 100 caracteres
        biografia:
          type: string
          example: "Artista"
          description: Sem limite de caracteres
        data_nascimento:
          type: string
          format: date
          example: "2009-04-30"
        id_sexo_diretor:
          type: integer
          format: int64
          example: 2
          description: ID do sexo do diretor
        id_nacionalidade_diretor:
          type: integer
          format: int64
          example: 2
          description: ID da nacionalidade do diretor
        foto:
          type: array
          description: Lista de IDs de fotos associadas ao diretor
          items:
            $ref: '#/components/schemas/IdRef'
          example:
            - id: 2
        atividade:
          type: array
          description: Lista de IDs de atividades exercidas pelo diretor
          items:
            $ref: '#/components/schemas/IdRef'
          example:
            - id: 3

    DiretorGet:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nome:
          type: string
          maxLength: 100
          example: "Camila Rocha"
        biografia:
          type: string
          example: "Artista"
        data_nascimento:
          type: string
          format: date
          example: "2009-04-30"
        id_sexo_diretor:
          type: integer
          format: int64
          example: 2
        id_nacionalidade_diretor:
          type: integer
          format: int64
          example: 2
        foto:
          type: array
          items:
            $ref: '#/components/schemas/IdRef'
        atividade:
          type: array
          items:
            $ref: '#/components/schemas/IdRef'

    # ── ATOR ──
    Ator:
      required:
        - nome
        - data_nascimento
        - id_sexo_ator
        - id_nacionalidade_ator
      type: object
      properties:
        nome:
          type: string
          maxLength: 100
          example: "Camila Rocha"
          description: Máximo de 100 caracteres
        biografia:
          type: string
          example: "Artista"
          description: Sem limite de caracteres
        data_nascimento:
          type: string
          format: date
          example: "2009-04-30"
        id_sexo_ator:
          type: integer
          format: int64
          example: 2
          description: ID do sexo do ator
        id_nacionalidade_ator:
          type: integer
          format: int64
          example: 2
          description: ID da nacionalidade do ator
        foto:
          type: array
          description: Lista de IDs de fotos associadas ao ator
          items:
            $ref: '#/components/schemas/IdRef'
          example:
            - id: 2
        atividade:
          type: array
          description: Lista de IDs de atividades exercidas pelo ator
          items:
            $ref: '#/components/schemas/IdRef'
          example:
            - id: 3

    AtorGet:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nome:
          type: string
          maxLength: 100
          example: "Camila Rocha"
        biografia:
          type: string
          example: "Artista"
        data_nascimento:
          type: string
          format: date
          example: "2009-04-30"
        id_sexo_ator:
          type: integer
          format: int64
          example: 2
        id_nacionalidade_ator:
          type: integer
          format: int64
          example: 2
        foto:
          type: array
          items:
            $ref: '#/components/schemas/IdRef'
        atividade:
          type: array
          items:
            $ref: '#/components/schemas/IdRef'

    # ── GÊNERO ──
    Genero:
      required:
        - genero
      type: object
      properties:
        genero:
          type: string
          maxLength: 30
          example: "Terror"
          description: Máximo de 30 caracteres

    GeneroGet:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        genero:
          type: string
          maxLength: 30
          example: "Terror"

    # ── CLASSIFICAÇÃO ──
    Classificacao:
      required:
        - classificacao
      type: object
      properties:
        classificacao:
          type: string
          maxLength: 6
          example: "+18"
          description: Máximo de 6 caracteres

    ClassificacaoGet:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        classificacao:
          type: string
          maxLength: 6
          example: "+18"

    # ── SEXO ──
    Sexo:
      required:
        - sexo
        - sigla
      type: object
      properties:
        sexo:
          type: string
          maxLength: 20
          example: "Feminino"
          description: Máximo de 20 caracteres
        sigla:
          type: string
          maxLength: 3
          example: "F"
          description: Máximo de 3 caracteres

    SexoGet:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        sexo:
          type: string
          maxLength: 20
          example: "Masculino"
        sigla:
          type: string
          maxLength: 3
          example: "M"

    # ── NACIONALIDADE ──
    Nacionalidade:
      required:
        - nacionalidade
        - sigla
      type: object
      properties:
        nacionalidade:
          type: string
          maxLength: 90
          example: "Brasileiro"
          description: Máximo de 90 caracteres
        sigla:
          type: string
          maxLength: 4
          example: "BR"
          description: Máximo de 4 caracteres

    NacionalidadeGet:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nacionalidade:
          type: string
          maxLength: 90
          example: "Brasileiro"
        sigla:
          type: string
          maxLength: 4
          example: "BR"

    # ── ATIVIDADE ──
    Atividade:
      required:
        - atividade
      type: object
      properties:
        atividade:
          type: string
          maxLength: 40
          example: "Dublê"
          description: Máximo de 40 caracteres

    AtividadeGet:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        atividade:
          type: string
          maxLength: 40
          example: "Dublê"

    # ── FOTO ──
    Foto:
      required:
        - foto_url
      type: object
      properties:
        foto_url:
          type: string
          maxLength: 255
          example: "https://exemplo.com/fotos/camila.jpg"
          description: Máximo de 255 caracteres

    FotoGet:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        foto_url:
          type: string
          maxLength: 255
          example: "https://exemplo.com/fotos/camila.jpg"

  # ── Request Bodies reutilizáveis ──
  requestBodies:
    Ator:
      description: Objeto que deve ser enviado no Body das requisições
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Ator'
    Diretor:
      description: Objeto que deve ser enviado no Body das requisições
